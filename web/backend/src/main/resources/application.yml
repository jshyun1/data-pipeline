spring:
  application:
    name: pipeline-backend
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak cerebro realm이 발급한 토큰만 신뢰. issuer는 브라우저/컨테이너
          # 공통 URL(host.docker.internal)이라 토큰의 iss 클레임과 일치한다.
          issuer-uri: ${KEYCLOAK_ISSUER_URL:http://host.docker.internal:8180}/realms/${KEYCLOAK_REALM:cerebro}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pipeline_meta}
    username: ${SPRING_DATASOURCE_USERNAME:pipeline_app}
    password: ${SPRING_DATASOURCE_PASSWORD:devpassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}

pipeline:
  crypto:
    secret: ${PIPELINE_CRYPTO_SECRET}
    salt: ${PIPELINE_CRYPTO_SALT}

kafka-connect:
  base-url: ${KAFKA_CONNECT_URL:http://localhost:8083}

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

filebeat:
  inputs-dir: ${FILEBEAT_INPUTS_DIR:/filebeat-inputs}

nifi:
  base-url: ${NIFI_BASE_URL:https://localhost:8443}
  username: ${NIFI_USERNAME:}
  password: ${NIFI_PASSWORD:}
