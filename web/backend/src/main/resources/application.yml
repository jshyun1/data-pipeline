spring:
  application:
    name: pipeline-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pipeline_meta}
    username: ${SPRING_DATASOURCE_USERNAME:pipeline_app}
    password: ${SPRING_DATASOURCE_PASSWORD:devpassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}

pipeline:
  crypto:
    secret: ${PIPELINE_CRYPTO_SECRET}
    salt: ${PIPELINE_CRYPTO_SALT}
  jwt:
    secret: ${PIPELINE_JWT_SECRET}
    # 30일 (ms 단위). 공유 계정 성격상 로그인을 자주 다시 안 하도록 길게 잡는다.
    expiration: 2592000000

# 통합 계정 테이블(ST_USER) - 여러 시스템이 공유하는 실 사용자 디렉터리(MySQL).
# 로그인 검증(SELECT)에만 쓰고 절대 쓰기하지 않는다.
account-db:
  host: ${ACCOUNT_DB_HOST}
  port: ${ACCOUNT_DB_PORT:3306}
  name: ${ACCOUNT_DB_NAME}
  username: ${ACCOUNT_DB_USER}
  password: ${ACCOUNT_DB_PASSWORD}

kafka-connect:
  base-url: ${KAFKA_CONNECT_URL:http://localhost:8083}

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

filebeat:
  inputs-dir: ${FILEBEAT_INPUTS_DIR:/filebeat-inputs}

nifi:
  base-url: ${NIFI_BASE_URL:https://localhost:8443}
  # NiFi가 Single User 인증(공유 서비스계정)으로 전환됨에 따라 username/password로
  # 직접 /nifi-api/access/token을 받아 Bearer로 제시한다 (Keycloak 제거).
  username: ${NIFI_USERNAME:}
  password: ${NIFI_PASSWORD:}
