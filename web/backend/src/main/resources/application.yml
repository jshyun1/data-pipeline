spring:
  application:
    name: pipeline-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pipeline_meta}
    username: ${SPRING_DATASOURCE_USERNAME:pipeline_app}
    password: ${SPRING_DATASOURCE_PASSWORD:devpassword}
    driver-class-name: org.postgresql.Driver
    # JDBC 타임아웃(설계서 3-2). 기존엔 Hikari/드라이버 타임아웃이 없어 소켓이 무한 대기였다.
    hikari:
      connection-timeout: 3000          # 풀에서 커넥션 획득 대기 상한(ms). 기본 30s는 관제 응답을 늘린다.
      data-source-properties:
        connectTimeout: 3               # postgres 드라이버 TCP connect 상한(초)
        socketTimeout: 10               # postgres 드라이버 소켓 read 상한(초). 무한 대기 차단
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  # 알림 EMAIL 릴레이. host 는 여기 두지 않는다(설정 시 자동설정이 켜져 빈이 생김).
  # SPRING_MAIL_HOST 가 주입될 때만 JavaMailSender 빈이 만들어지고, 없으면 NO_RELAY 폴백.
  mail:
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# 알림 이메일 발신 정책(설계서 발송). enabled=false 면 릴레이하지 않고 NO_RELAY 로 둔다.
notification:
  email:
    enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
    from: ${NOTIFICATION_EMAIL_FROM:alerts@pipeline.local}

server:
  port: ${SERVER_PORT:8081}

pipeline:
  crypto:
    secret: ${PIPELINE_CRYPTO_SECRET}
    salt: ${PIPELINE_CRYPTO_SALT}
  jwt:
    secret: ${PIPELINE_JWT_SECRET}
    # 30일 (ms 단위). 공유 계정 성격상 로그인을 자주 다시 안 하도록 길게 잡는다.
    expiration: 2592000000

# 인증 소스 (U3, 설계서 C9). LOCAL=app_user 기반 로컬 인증(상용 기본) / EXTERNAL=사내 ST_USER 연동.
# LOCAL 에서는 account-db.* 빈을 아예 만들지 않으므로 ACCOUNT_DB_* 미설정으로도 부팅된다
# (기존엔 account-db.host 기본값이 없어 ST_USER 없는 고객사는 부팅조차 못 하던 판매 차단 버그).
authz:
  provider: ${AUTHZ_PROVIDER:LOCAL}

# 통합 계정 테이블(ST_USER) - 여러 시스템이 공유하는 실 사용자 디렉터리(MySQL).
# 로그인 검증(SELECT)에만 쓰고 절대 쓰기하지 않는다. authz.provider=EXTERNAL 일 때만 쓴다.
account-db:
  host: ${ACCOUNT_DB_HOST}
  port: ${ACCOUNT_DB_PORT:3306}
  name: ${ACCOUNT_DB_NAME}
  username: ${ACCOUNT_DB_USER}
  password: ${ACCOUNT_DB_PASSWORD}

kafka-connect:
  base-url: ${KAFKA_CONNECT_URL:http://localhost:8083}

# Oracle CDC(Debezium LogMiner) 소스 커넥터 설정. archive-log-only를 켜면 온라인 redo를
# 읽지 않고 아카이브 로그만 읽는다 - 지연이 redo 스위치 주기만큼 늘어나므로, 운영 DB가
# 온라인 redo 접근을 막는 환경에서만 켠다(아카이브 보존 기간을 지연보다 길게 잡을 것).
oracle-cdc:
  archive-log-only: ${ORACLE_ARCHIVE_LOG_ONLY:false}
  cdb-name: ${ORACLE_CDB_NAME:XE}

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

filebeat:
  inputs-dir: ${FILEBEAT_INPUTS_DIR:/filebeat-inputs}

# 대시보드 인프라 구역에서 Airflow 스케줄러/DAG 프로세서 생존 확인(monitor/health)용.
# 조회 전용이고 인증이 필요 없는 엔드포인트만 쓴다.
airflow:
  base-url: ${AIRFLOW_BASE_URL:http://airflow-apiserver:8080}

# 대시보드 인프라 구역의 서버 리소스. proc-path는 컨테이너 안에서도 호스트 값이 보이는
# procfs 경로, disk-paths는 사용률을 볼 마운트 경로다(쉼표로 여러 개 지정 가능).
infra:
  proc-path: ${INFRA_PROC_PATH:/proc}
  disk-paths: ${INFRA_DISK_PATHS:/}
  # 디스크 용도별 분해(원본 5-3 #12). "라벨=경로" 목록이며, compose 에서 읽기전용으로
  # 바인드한 경로만 유효하다. 마운트가 없으면 그 항목은 조용히 빠지고 화면도 구역을 감춘다.
  volume-paths: ${INFRA_VOLUME_PATHS:Kafka 로그=/observed/kafka,NiFi 콘텐츠=/observed/nifi-content,NiFi 프로버넌스=/observed/nifi-provenance,NiFi FlowFile=/observed/nifi-flowfile,NiFi 데이터베이스=/observed/nifi-database}

nifi:
  base-url: ${NIFI_BASE_URL:https://localhost:8443}
  # NiFi가 Single User 인증(공유 서비스계정)으로 전환됨에 따라 username/password로
  # 직접 /nifi-api/access/token을 받아 Bearer로 제시한다 (Keycloak 제거).
  username: ${NIFI_USERNAME:}
  password: ${NIFI_PASSWORD:}
