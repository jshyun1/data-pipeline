spring:
  application:
    name: pipeline-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pipeline_meta}
    username: ${SPRING_DATASOURCE_USERNAME:pipeline_app}
    password: ${SPRING_DATASOURCE_PASSWORD:devpassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}

pipeline:
  crypto:
    secret: ${PIPELINE_CRYPTO_SECRET}
    salt: ${PIPELINE_CRYPTO_SALT}
  jwt:
    # 통합 웹 로그인 JWT 서명 키. 기본값 없음(없으면 부팅 실패) - 하드코딩 키 방지.
    # HMAC-SHA용으로 최소 32바이트 이상이어야 함.
    secret: ${PIPELINE_JWT_SECRET}
    expiration-minutes: ${PIPELINE_JWT_EXPIRATION_MINUTES:480}

kafka-connect:
  base-url: ${KAFKA_CONNECT_URL:http://localhost:8083}

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

filebeat:
  inputs-dir: ${FILEBEAT_INPUTS_DIR:/filebeat-inputs}

nifi:
  base-url: ${NIFI_BASE_URL:https://localhost:8443}
  username: ${NIFI_USERNAME:}
  password: ${NIFI_PASSWORD:}
