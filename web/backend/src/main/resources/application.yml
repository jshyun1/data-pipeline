spring:
  application:
    name: pipeline-backend
  security:
    oauth2:
      resourceserver:
        jwt:
          # 토큰 iss 검증값(브라우저가 받은 토큰의 iss = localhost).
          issuer-uri: ${KEYCLOAK_ISSUER_URL:https://localhost:8543}/realms/${KEYCLOAK_REALM:cerebro}
          # JWKS는 컨테이너가 실제로 도달 가능한 백채널 URL에서 가져온다(iss와 host가 다름).
          jwk-set-uri: ${KEYCLOAK_BACKCHANNEL_URL:https://host.docker.internal:8543}/realms/${KEYCLOAK_REALM:cerebro}/protocol/openid-connect/certs
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pipeline_meta}
    username: ${SPRING_DATASOURCE_USERNAME:pipeline_app}
    password: ${SPRING_DATASOURCE_PASSWORD:devpassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}

pipeline:
  crypto:
    secret: ${PIPELINE_CRYPTO_SECRET}
    salt: ${PIPELINE_CRYPTO_SALT}

kafka-connect:
  base-url: ${KAFKA_CONNECT_URL:http://localhost:8083}

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

filebeat:
  inputs-dir: ${FILEBEAT_INPUTS_DIR:/filebeat-inputs}

nifi:
  base-url: ${NIFI_BASE_URL:https://localhost:8443}
  username: ${NIFI_USERNAME:}
  password: ${NIFI_PASSWORD:}
