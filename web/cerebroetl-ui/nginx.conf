server {
    # docker-compose maps host CEREBROETL_UI_PORT to container 80.
    # NiFi requires Secure cookies for state-changing requests, so the mapped
    # external port must speak HTTPS.
    listen 80 ssl;
    # Plain HTTP is kept only inside the container for Docker healthcheck.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    resolver 127.0.0.11 ipv6=off valid=10s;

    # SPA: 새로고침 시 React Router 경로(/pipelines 등)도 index.html로 서빙.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 프론트 JS는 상대경로 /api/*로만 호출하고, 실제 백엔드 주소는 여기서만 안다.
    location /api/ {
        rewrite ^/api/(.*)$ /api/$1 break;
        set $pipeline_api_upstream pipeline-api:8081;
        proxy_pass http://$pipeline_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /airflow-api/ {
        rewrite ^/airflow-api/(.*)$ /api/v2/$1 break;
        set $airflow_upstream airflow-apiserver:8080;
        proxy_pass http://$airflow_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /kafka-connect-api/ {
        set $kafka_connect_upstream kafka-connect:8083;
        proxy_pass http://$kafka_connect_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /nifi {
        return 308 https://$http_host/nifi/;
    }

    location = /nf {
        return 308 https://$http_host/nifi/;
    }

    location /nifi/ {
        proxy_pass https://nifi:8443/nifi/;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_set_header Host localhost:8443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect https://localhost:8443/ /;
        proxy_redirect /nifi https://$http_host/nifi/;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    location /nf/ {
        proxy_pass https://nifi:8443/nf/;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_set_header Host localhost:8443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect https://localhost:8443/ /;
        proxy_redirect /nifi https://$http_host/nifi/;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    location /nifi-api/ {
        proxy_pass https://nifi:8443/nifi-api/;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_set_header Host localhost:8443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect https://localhost:8443/ /;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    location /nifi-content-viewer/ {
        proxy_pass https://nifi:8443/nifi-content-viewer/;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_set_header Host localhost:8443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    location /nifi-docs/ {
        proxy_pass https://nifi:8443/nifi-docs/;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_set_header Host localhost:8443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    location /nifi-extensions/ {
        proxy_pass https://nifi:8443/nifi-extensions/;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_set_header Host localhost:8443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    location /nifi-websocket/ {
        proxy_pass https://nifi:8443/nifi-websocket/;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host localhost:8443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }
}
