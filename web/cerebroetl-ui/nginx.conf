server {
    # docker-compose maps host CEREBROETL_UI_PORT to container 80.
    # NiFi/Airflow 자격증명은 nginx가 공유 서비스계정으로 서버사이드에서 주입하므로
    # (shared-credentials.conf), 브라우저가 Secure 쿠키를 들고 다닐 필요가 없어져서
    # 이 포트를 평문 HTTP로 내렸다 (MSA 포탈도 http라 scheme이 이제 통일됨).
    listen 80;
    # Plain HTTP is kept only inside the container for Docker healthcheck.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    resolver 127.0.0.11 ipv6=off valid=10s;

    # NiFi/Airflow 공유 서비스계정 토큰 - refresh-credentials.sh(crond)가 주기적으로
    # 갱신하는 파일. $nifi_shared_bearer / $airflow_shared_cookie 두 변수를 정의한다.
    include /etc/nginx/generated/shared-credentials.conf;

    # SPA: 새로고침 시 React Router 경로(/pipelines 등)도 index.html로 서빙.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 프론트 JS는 상대경로 /api/*로만 호출하고, 실제 백엔드 주소는 여기서만 안다.
    location /api/ {
        set $pipeline_api_upstream pipeline-api:8081;
        rewrite ^/api/(.*)$ /api/$1 break;
        proxy_pass http://$pipeline_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # React 대시보드 경로는 아래 Airflow 자체 UI 프록시에 넘기지 않는다.
    # 이 예외가 없으면 직접 접근/새로고침 시 Airflow 홈 화면이 응답한다.
    location = /airflow/dashboard {
        try_files /index.html =404;
    }

    location = /airflow {
        return 308 http://$http_host/airflow/;
    }

    # Airflow 3의 FAB 인증/확인 페이지는 URL을 /airflow/static/... 로 만들지만
    # 실제 정적 라우트는 /airflow/auth/static/... 아래에 마운트된다. 새 React UI의
    # /airflow/static/assets 및 i18n은 건드리지 않고 FAB 전용 두 경로만 보정한다.
    location ~ ^/airflow/static/(appbuilder|dist)/(.*)$ {
        set $airflow_upstream airflow-apiserver:8080;
        rewrite ^/airflow/static/(.*)$ /airflow/auth/static/$1 break;
        proxy_pass http://$airflow_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /airflow;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        # 로컬 개발(localhost:5173)과 MSA 운영 서버(192.168.50.30:5173) 양쪽에서
        # 같은 이미지로 iframe 임베드가 되도록 두 origin을 함께 허용한다.
        add_header Content-Security-Policy "frame-ancestors 'self' http://localhost:5173 http://192.168.50.30:5173" always;
        # 브라우저가 뭘 보내든 상관없이 공유 서비스계정 세션을 얹어 보낸다 - Keycloak
        # 제거 이후 브라우저가 Airflow 자체 쿠키를 들고 있을 필요가 없어졌다.
        proxy_set_header Cookie "$http_cookie; $airflow_shared_cookie";
    }

    # Airflow 3 UI는 AIRFLOW__API__BASE_URL의 /airflow prefix를 기준으로
    # 정적 자원과 API URL을 생성한다. URI를 rewrite하지 않고 prefix 그대로 전달한다.
    location /airflow/ {
        set $airflow_upstream airflow-apiserver:8080;
        proxy_pass http://$airflow_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /airflow;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_redirect http://localhost:8090/ http://$http_host/airflow/;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "frame-ancestors 'self' http://localhost:5173 http://192.168.50.30:5173" always;
        proxy_set_header Cookie "$http_cookie; $airflow_shared_cookie";
    }

    location /kafka-connect-api/ {
        set $kafka_connect_upstream kafka-connect:8083;
        # proxy_pass 대상이 변수라서 nginx가 정적 URI일 때처럼 위치 프리픽스를 자동으로
        # 벗겨내지 못한다(요청 경로와 무관하게 항상 "/"만 전달되는 문제가 있었음) -
        # rewrite로 프리픽스를 직접 제거한 뒤 URI 없는 proxy_pass로 넘긴다.
        rewrite ^/kafka-connect-api/(.*)$ /$1 break;
        proxy_pass http://$kafka_connect_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /nifi {
        return 308 http://$http_host/nifi/;
    }

    location = /nf {
        return 308 http://$http_host/nifi/;
    }

    location /nifi/ {
        set $nifi_upstream nifi:8443;
        proxy_pass https://$nifi_upstream;
        proxy_set_header If-Modified-Since "";
        proxy_set_header If-None-Match "";
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_set_header Host localhost:8443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect https://localhost:8443/ /;
        proxy_redirect /nifi http://$http_host/nifi/;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        add_header Cache-Control "no-store" always;
        proxy_set_header Authorization $nifi_shared_bearer;
    }

    location /nf/ {
        set $nifi_upstream nifi:8443;
        proxy_pass https://$nifi_upstream;
        proxy_set_header If-Modified-Since "";
        proxy_set_header If-None-Match "";
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_set_header Host localhost:8443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect https://localhost:8443/ /;
        proxy_redirect /nifi http://$http_host/nifi/;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        add_header Cache-Control "no-store" always;
        proxy_set_header Authorization $nifi_shared_bearer;
    }

    location /nifi-api/ {
        set $nifi_upstream nifi:8443;
        proxy_pass https://$nifi_upstream;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_set_header Host localhost:8443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect https://localhost:8443/ /;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_set_header Authorization $nifi_shared_bearer;
    }

    location /nifi-content-viewer/ {
        set $nifi_upstream nifi:8443;
        proxy_pass https://$nifi_upstream;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_set_header Host localhost:8443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_set_header Authorization $nifi_shared_bearer;
    }

    location /nifi-docs/ {
        set $nifi_upstream nifi:8443;
        proxy_pass https://$nifi_upstream;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_set_header Host localhost:8443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_set_header Authorization $nifi_shared_bearer;
    }

    location /nifi-extensions/ {
        set $nifi_upstream nifi:8443;
        proxy_pass https://$nifi_upstream;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_set_header Host localhost:8443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_set_header Authorization $nifi_shared_bearer;
    }

    location /nifi-websocket/ {
        set $nifi_upstream nifi:8443;
        proxy_pass https://$nifi_upstream;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host localhost:8443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_set_header Authorization $nifi_shared_bearer;
    }
}
