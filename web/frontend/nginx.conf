server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: 새로고침 시 React Router 경로(/pipelines 등)도 index.html로 서빙.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 프론트 JS는 상대경로 /api/*로만 호출하고, 실제 백엔드 주소는 여기서만 안다.
    location /api/ {
        proxy_pass http://pipeline-api:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
