stages:
  - validate
  - test
  - build

variables:
  DOCKER_DRIVER: overlay2

validate:compose:
  stage: validate
  image: docker:26-cli
  services:
    - docker:26-dind
  before_script:
    - apk add --no-cache docker-cli-compose
  script:
    - cp .env.example .env
    - docker compose config > /dev/null
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'

# web/backend의 유닛/통합 테스트. ConnectionRepositoryIT는 Testcontainers로 실제
# Postgres 컨테이너를 띄우는데, 로컬 WSL2+Docker Desktop 환경에서는 Docker Desktop의
# WSL2 통합 소켓이 degraded된 /info 응답을 줘서 docker-java 클라이언트가 거부하는
# 문제가 있었다(WORK_LOG.md 참고) - 그게 로컬 환경 특유의 문제인지 코드 문제인지
# gitlab.com 공유 러너(docker:26-dind)에서 실제로 확인한다.
test:backend:
  stage: test
  image: eclipse-temurin:21-jdk
  services:
    - docker:26-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
  cache:
    key: "gradle-$CI_COMMIT_REF_SLUG"
    paths:
      - .gradle-home/wrapper
      - .gradle-home/caches
  script:
    - cd web/backend
    - ./gradlew test --no-daemon
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: web/backend/build/test-results/test/TEST-*.xml
    paths:
      - web/backend/build/reports/tests/test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'

build:kafka-connect:
  stage: build
  image: docker:26-cli
  services:
    - docker:26-dind
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/kafka-connect:$CI_COMMIT_SHORT_SHA" ./kafka-connect
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'

build:nifi:
  stage: build
  image: docker:26-cli
  services:
    - docker:26-dind
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/nifi:$CI_COMMIT_SHORT_SHA" ./nifi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
