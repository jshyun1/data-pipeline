# ---------------------------------------------------------------------
# 감사 로그에 "실제 클라이언트 IP"를 남기기 위한 오버라이드 (리눅스 서버 전용).
#
# 문제: docker 포트 매핑(docker-proxy)을 거치면 출발지 주소가 브리지 게이트웨이
#       (172.x.0.1)로 SNAT 되어, permission_audit_log.client_ip 에 작업 PC IP 대신
#       게이트웨이 주소가 남는다. 컨테이너가 보는 주소 자체가 이미 바뀌어 있어서
#       헤더로는 복원할 수 없다.
# 해결: 공개 포트를 host 네트워크로 뜨는 front-proxy 가 대신 받아(= docker-proxy 를
#       거치지 않아 실제 IP 가 보인다) X-Forwarded-For 로 뒤에 넘긴다.
#       UI/API 컨테이너는 루프백으로 비켜서 front-proxy 만 접근하게 한다.
#
# 쓰는 법 - 서버 .env 에 이 한 줄만 추가하면 이후 모든 docker compose 명령에 적용된다:
#     COMPOSE_FILE=docker-compose.yml:docker-compose.realip.yml
#   그리고 평소처럼:  docker compose up -d
#   되돌리기: 그 한 줄을 지우고  docker rm -f front-proxy && docker compose up -d
#
# 주의: Docker Desktop(Windows/Mac/WSL)은 host 네트워크 컨테이너의 포트를 호스트로
#       노출하지 않는다. 로컬 개발 PC 에서는 쓰지 말 것(공개 포트 접속 불가).
#
# 자세한 배경: docs/audit-client-ip-front-proxy.md
# ---------------------------------------------------------------------
services:
  # 공개 포트는 front-proxy 가 가져가므로, 두 컨테이너는 루프백에만 붙는다.
  # (겸사겸사 공개 포트를 우회해 X-Forwarded-For 를 위조하는 경로도 막힌다.)
  cerebroetl-ui:
    ports: !override
      - "127.0.0.1:13101:80"

  pipeline-api:
    ports: !override
      - "127.0.0.1:18186:${PIPELINE_API_PORT}"

  # 최전방 리버스 프록시. 이미지는 cerebroetl-ui 와 같은 것을 재사용하고 설정만
  # 갈아끼운다 - 폐쇄망 반입 이미지 목록(offline/image-manifest.json)이 그대로다.
  front-proxy:
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    image: data-pipeline-cerebroetl-ui:${APP_VERSION:-latest}
    container_name: front-proxy
    restart: unless-stopped
    depends_on:
      cerebroetl-ui:
        condition: service_healthy
    # host 네트워크라 포트 매핑이 없다 - 아래 두 포트를 호스트에서 직접 점유한다.
    network_mode: host
    # 이미지 자체 엔트리포인트(NiFi/Airflow 자격증명 갱신 crond)는 여기서 불필요하므로
    # nginx:alpine 원래 엔트리포인트로 되돌린다(templates 의 ${...} 를 envsubst 가 치환).
    #
    # 앞의 test 는 안전장치다. 마운트할 템플릿이 서버에 없으면 도커가 그 자리에 빈
    # 디렉터리를 만들어 버리는데(데몬 기본 동작, create_host_path:false 로도 못 막는다),
    # 그러면 nginx 가 이미지에 구워진 UI 설정으로 떠서 공개 포트는 안 열리고 호스트의
    # 80/8080 만 점유하는 조용한 사고가 난다. 차라리 시끄럽게 죽는 편이 낫다.
    entrypoint:
      - sh
      - -c
      - |
        test -f /etc/nginx/templates/default.conf.template || {
          echo "front-proxy: deploy/front-proxy/default.conf.template 이 서버에 없습니다." >&2
          echo "             리포지토리 파일을 배포한 뒤 다시 기동하세요." >&2
          exit 1
        }
        exec /docker-entrypoint.sh "$@"
      - sh
    command: ["nginx", "-g", "daemon off;"]
    environment:
      TZ: Asia/Seoul
      # 사용자가 접속하는 공개 포트(기존과 동일 - 주소를 바꿀 필요가 없다).
      FRONT_PROXY_UI_PORT: ${CEREBROETL_UI_PORT}
      FRONT_PROXY_API_PORT: ${PIPELINE_API_PUBLIC_PORT}
      # 위에서 루프백으로 비켜 둔 포트(위 ports 값과 반드시 같아야 한다).
      UI_INTERNAL_PORT: 13101
      API_INTERNAL_PORT: 18186
    volumes:
      - ./deploy/front-proxy/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:${CEREBROETL_UI_PORT}/__fp_health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 32m
