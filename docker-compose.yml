# 컨테이너 stdout/stderr는 도커가 JSON 파일 하나에 계속 이어붙이는데, 기본값에는
# 상한이 없어서 컨테이너를 지우기 전까지 그 파일이 절대 줄지 않는다. 오래 도는
# 서비스에서 디스크가 조용히 차는 전형적인 원인이라 컨테이너당 상한을 걸어둔다.
#
# 50MB짜리 조각 5개 = 서비스당 최대 250MB, 넘으면 가장 오래된 조각부터 자동 삭제.
#
# nifi/kafka의 자체 로그 파일(nifi-app.log, server.log)은 호스트로 빼지 않는다.
# 두 컨테이너 모두 같은 내용을 stdout으로도 내보내고 있어서(실측: 마지막 줄까지
# 동일) 여기 로테이션만으로 같은 로그가 250MB까지 남는다. 호스트 bind로 빼면
# 서버마다 디렉터리를 미리 만들고 UID 1000으로 소유권을 맞춰야 하는데, 그 UID는
# 베이스 이미지에 종속이라 이미지가 바뀌면 조용히 기동이 깨진다 - 중복 저장을
# 위해 이식성을 깎는 거래라 하지 않는다. 장기 보존이 필요하면 bind가 아니라
# filebeat 같은 수집기로 내보낼 것.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

networks:
  pipeline-net:
    driver: bridge

volumes:
  target-db-data:
  kafka-data:
  nifi-state:
  nifi-conf:
  nifi-database-repository:
  nifi-flowfile-repository:
  nifi-content-repository:
  nifi-provenance-repository:
  metadata-db-data:
  filebeat-inputs:
  filebeat-registry:

services:
  # ---------------------------------------------------------------------
  # Target: "타란툴라DB" (PostgreSQL 기반) POC 스탠드인.
  # 실제 사내 타란툴라DB 사용 시 --profile poc 없이 실행하고
  # .env 의 TARGET_DB_HOST/PORT/계정을 실제 값으로 지정하세요.
  # ---------------------------------------------------------------------
  target-db:
    logging: *default-logging
    image: ${TARGET_DB_IMAGE}
    profiles: ["poc"]
    container_name: target-db
    restart: unless-stopped
    # wal_level=logical: Postgres를 CDC 소스로도 쓰는 파이프라인(Debezium pgoutput)을
    # 지원하려면 필요. sink 전용 용도에도 상위 호환이라 기존 동작에는 영향 없음.
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_DB: ${TARGET_DB_NAME}
      POSTGRES_USER: ${TARGET_DB_USER}
      POSTGRES_PASSWORD: ${TARGET_DB_PASSWORD}
    ports:
      - "${TARGET_DB_PORT}:5432"
    volumes:
      - target-db-data:/var/lib/postgresql/data
      - ./db/target-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TARGET_DB_USER} -d ${TARGET_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384m
    networks: [pipeline-net]

  # ---------------------------------------------------------------------
  # Kafka (KRaft 모드, 브로커+컨트롤러 결합, 단일 노드)
  # ---------------------------------------------------------------------
  kafka:
    logging: *default-logging
    image: ${KAFKA_IMAGE}
    container_name: kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 토픽 데이터(파티션 세그먼트, __consumer_offsets, KRaft 메타데이터)가 저장되는 곳.
      #
      # 이 값을 안 주면 브로커가 기본값 /tmp/kafka-logs를 쓴다 - 컨테이너 안이라
      # 재생성 한 번이면 토픽과 컨슈머 오프셋이 통째로 사라진다. 아래 kafka-data
      # 볼륨은 선언만 돼 있고 실제로는 아무것도 안 받고 있었다(실측: 볼륨 0항목,
      # /tmp/kafka-logs에 250MB/파티션 98개). 볼륨을 가리키게 해서 컨테이너 수명과
      # 데이터 수명을 분리한다.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS}
    ports:
      - "${KAFKA_BROKER_PORT}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 640m
    networks: [pipeline-net]

  # ---------------------------------------------------------------------
  # Kafka Connect + Debezium Oracle(LogMiner) 커넥터 (CDC 실시간 캡처)
  # ---------------------------------------------------------------------
  kafka-connect:
    logging: *default-logging
    image: data-pipeline-kafka-connect:${APP_VERSION:-latest}
    build:
      context: ./kafka-connect
      args:
        CONNECT_IMAGE_TAG: ${CONNECT_IMAGE_TAG}
        DEBEZIUM_VERSION: ${DEBEZIUM_VERSION}
        OJDBC_VERSION: ${OJDBC_VERSION}
        POSTGRES_JDBC_VERSION: ${POSTGRES_JDBC_VERSION}
    container_name: kafka-connect
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_GROUP_ID: ${CONNECT_GROUP_ID}
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      # Debezium JDBC Sink(schema.evolution/primary.key.mode=record_key)는 Kafka
      # 레코드의 키/값 모두에 Connect 스키마가 실려 있어야 동작함(스키마 없으면
      # "cannot have null schema" / Struct 캐스팅 NPE 발생) -> 키/값 모두 활성화
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "true"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "true"
      # CDC 메시지는 schemas.enable=true라 행마다 동일한 스키마 블록이 통째로 반복된다
      # (실측: 행 1건 5,333B 중 스키마가 4,284B, 실제 컬럼값은 163B). 그 반복 때문에
      # 압축이 극단적으로 잘 들어서, 형식을 바꾸지 않고도 디스크/네트워크가 크게 준다
      # (실측: 실제 메시지 20건 199KB -> 6.7KB). 스키마를 끄는 건 JDBC Sink가 깨지므로
      # 불가(위 주석 참고) - 압축은 메시지 형식을 그대로 두므로 싱크에 영향이 없다.
      # CPU 여유가 없으면 lz4로 낮출 것(압축률은 떨어지지만 더 싸다).
      CONNECT_PRODUCER_COMPRESSION_TYPE: ${CONNECT_COMPRESSION_TYPE:-zstd}
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      KAFKA_HEAP_OPTS: ${CONNECT_HEAP_OPTS}
    # Kafka Connect REST API는 자체 인증이 없어서 호스트에 노출하지 않는다 - pipeline-api
    # 등 같은 docker 네트워크 안의 컨테이너만 kafka-connect:8083으로 접근 가능하다.
    # (인증 없는 REST가 호스트에 열려있으면 앱을 거치지 않고 커넥터를 직접 지우거나
    # 바꿀 수 있어서, 실제로 이 경로로 커넥터가 앱 모르게 사라진 사고가 있었다.)
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1280m
    networks: [pipeline-net]

  # 최초 기동 시 1회 실행되어 정형 CDC 소스/싱크 커넥터를 REST API로 등록
  # (Oracle LogMiner 소스 + Postgres JDBC 싱크)
  # ---------------------------------------------------------------------
  # NiFi: Kafka 토픽 소비 -> 정형/비정형 ETL -> 타깃 DB 실시간 적재
  # (JDK 21 기반, NiFi 2.x 요구사항)
  # ---------------------------------------------------------------------
  nifi:
    logging: *default-logging
    image: data-pipeline-nifi:${APP_VERSION:-latest}
    build:
      context: ./nifi
      args:
        NIFI_IMAGE_TAG: ${NIFI_IMAGE_TAG}
        POSTGRES_JDBC_VERSION: ${POSTGRES_JDBC_VERSION}
        OJDBC_VERSION: ${OJDBC_VERSION}
    container_name: nifi
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      # NiFi 컨테이너와 JVM의 기본 시간대를 모두 한국시간으로 고정한다.
      # TZ는 OS/로그 시간에, user.timezone은 NiFi가 생성하는 화면·API 시간값에 적용된다.
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Seoul"
      NIFI_WEB_HTTPS_HOST: 0.0.0.0
      NIFI_WEB_HTTPS_PORT: ${NIFI_HTTPS_PORT}
      NIFI_JVM_HEAP_INIT: ${NIFI_JVM_HEAP_INIT}
      NIFI_JVM_HEAP_MAX: ${NIFI_JVM_HEAP_MAX}
      NIFI_WEB_PROXY_HOST: ${NIFI_WEB_PROXY_HOST}
      # --- Single User 인증(Keycloak/OIDC 제거, 공유 서비스계정으로 전환) ---
      # AUTH=tls는 실제 양방향 TLS를 쓰겠다는 뜻이 아니라, 이 이미지의 secure.sh가
      # tls/ldap/oidc 세 case에서만 호출되기 때문에 그 경로를 빌려 keystore/truststore와
      # login-identity-provider 설정을 재기동 때마다 멱등하게 재적용하기 위함이다.
      AUTH: tls
      # 적재 시작은 오직 Airflow가 지시한다. NiFi 기본값(true)이면 재시작 시 직전에
      # RUNNING이던 프로세서가 자동으로 되살아나, 아무도 지시하지 않았는데 컨테이너
      # 재시작만으로 대량 적재가 시작된다(실제로 두 번 사고가 났다). false로 두면
      # 무슨 이유로 재시작되든 전부 STOPPED로 올라오고, 시작은 제어 DAG가 담당한다.
      # apply-nifi-properties.sh가 기동할 때마다 nifi.properties에 반영한다.
      NIFI_AUTO_RESUME_STATE: "false"
      KEYSTORE_PATH: /opt/nifi/nifi-current/conf/keystore.p12
      KEYSTORE_TYPE: PKCS12
      KEYSTORE_PASSWORD: ${NIFI_KEYSTORE_PASSWORD}
      TRUSTSTORE_PATH: /opt/nifi/nifi-current/conf/truststore.p12
      TRUSTSTORE_TYPE: PKCS12
      TRUSTSTORE_PASSWORD: ${NIFI_TRUSTSTORE_PASSWORD}
      # authorizers.xml의 Initial Admin Identity는 정책이 이미 만들어진 뒤엔 재적용되지
      # 않는다(최초 부트스트랩 전용) - 실제로는 users.xml/authorizations.xml에 admin
      # 사용자를 cerebro-admin과 동일한 정책으로 수동 추가해뒀다. 이 값은 볼륨을 새로
      # 만드는 경우를 위한 문서화 목적.
      INITIAL_ADMIN_IDENTITY: ${NIFI_SINGLE_USER_USERNAME}
      NIFI_SECURITY_USER_LOGIN_IDENTITY_PROVIDER: single-user-provider
      SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_SINGLE_USER_USERNAME}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_SINGLE_USER_PASSWORD}
    expose:
      - "${NIFI_HTTPS_PORT}"
    ports:
      - "${NIFI_PUBLIC_HTTPS_PORT}:${NIFI_HTTPS_PORT}"
      - "${NIFI_LISTENHTTP_PUBLIC_PORT}:${NIFI_LISTENHTTP_PORT}"
      # "비정형" 그룹의 파일 수신 엔드포인트(POST /unstructured).
      # 여기만 기본값을 박아둔 이유: .env는 서버마다 손으로 관리하는 파일이라 새 변수를
      # 추가하면 기존 .env에는 없다. 기본값이 없으면 ":"로 펼쳐지면서 "no port specified"로
      # compose 전체가 안 뜬다 - 포트 하나 때문에 스택을 통째로 못 띄우는 건 과하다.
      # 포트를 바꾸려면 .env에 두 변수를 넣으면 그대로 우선한다.
      - "${NIFI_UNSTRUCTURED_HTTP_PUBLIC_PORT:-18444}:${NIFI_UNSTRUCTURED_HTTP_PORT:-8444}"
    volumes:
      # state는 컴포넌트 상태값(예: 마지막 처리 위치)만 저장한다. 캔버스에서
      # 만드는 실제 플로우 정의(flow.json.gz)는 conf/에 저장되는데 예전엔 이게
      # 볼륨이 아니었어서 down/재생성 때마다 작업 내용이 통째로 날아갔다 -
      # conf 및 저장소 디렉터리들도 전부 볼륨으로 영속화한다.
      - nifi-state:/opt/nifi/nifi-current/state
      - nifi-conf:/opt/nifi/nifi-current/conf
      - nifi-database-repository:/opt/nifi/nifi-current/database_repository
      - nifi-flowfile-repository:/opt/nifi/nifi-current/flowfile_repository
      - nifi-content-repository:/opt/nifi/nifi-current/content_repository
      - nifi-provenance-repository:/opt/nifi/nifi-current/provenance_repository
      - ./csv_data/in:/data/nifi/csv/in
      - ./csv_data/error:/data/nifi/csv/error
      - ./logfile/in:/data/nifi/logfile/in
      - ./logfile/error:/data/nifi/logfile/error
    healthcheck:
      test: ["CMD-SHELL", "curl -sfk https://localhost:${NIFI_HTTPS_PORT}/nifi/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3072m
    networks: [pipeline-net]

  # ---------------------------------------------------------------------
  # Metadata DB: Kafka 파이프라인 웹서비스 전용 Postgres (target-db와 별개).
  # docs/kafka-webservice-design.md §14 참고.
  # ---------------------------------------------------------------------
  metadata-db:
    logging: *default-logging
    image: postgres:16-alpine
    container_name: metadata-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${METADATA_DB_NAME}
      POSTGRES_USER: ${METADATA_DB_USER}
      POSTGRES_PASSWORD: ${METADATA_DB_PASSWORD}
      # 앱(KST)과 시각을 맞춘다(설계서 3-3 #5). 신규 테이블은 TIMESTAMPTZ라 무관하지만, 기존
      # naive 컬럼의 DEFAULT now() 기준을 앱과 통일해 9시간 어긋남을 없앤다. 적용은 metadata-db
      # 재생성이 필요하며, 기존 naive 컬럼 값의 불연속을 피하려 U7(MetricTimeSupport)과 함께 반영한다.
      TZ: ${CEREBRO_DISPLAY_ZONE:-Asia/Seoul}
    ports:
      - "${METADATA_DB_PORT}:5432"
    volumes:
      - metadata-db-data:/var/lib/postgresql/data
      - ./db/metadata-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${METADATA_DB_USER} -d ${METADATA_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 384m
    networks: [pipeline-net]

  # ---------------------------------------------------------------------
  # Pipeline API: web/backend (Spring Boot). Kafka Connect REST API를 제어하는
  # 웹서비스 백엔드. 이번 증분은 pipeline_connection CRUD까지만 구현됨
  # (KafkaConnectClient/ConnectorConfigRenderer는 다음 증분).
  # ---------------------------------------------------------------------
  pipeline-api:
    logging: *default-logging
    image: data-pipeline-pipeline-api:${APP_VERSION:-latest}
    build:
      context: ./web/backend
    container_name: pipeline-api
    restart: unless-stopped
    depends_on:
      metadata-db:
        condition: service_healthy
      kafka-connect:
        condition: service_healthy
      nifi:
        condition: service_healthy
    environment:
      # 미설정시 컨테이너 기본 타임존(UTC)로 LocalDateTime.now()가 기록되어 이력 화면의
      # 시각이 실제 KST와 9시간 어긋나던 문제 수정.
      TZ: Asia/Seoul
      SPRING_DATASOURCE_URL: jdbc:postgresql://${METADATA_DB_HOST}:5432/${METADATA_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${METADATA_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${METADATA_DB_PASSWORD}
      SERVER_PORT: ${PIPELINE_API_PORT}
      PIPELINE_CRYPTO_SECRET: ${PIPELINE_CRYPTO_SECRET}
      PIPELINE_CRYPTO_SALT: ${PIPELINE_CRYPTO_SALT}
      # cerebroetl-ui 자체 로그인(Keycloak 제거 후 계정테이블 기반) JWT 서명 키.
      PIPELINE_JWT_SECRET: ${PIPELINE_JWT_SECRET}
      # 통합 계정 테이블(ST_USER, MySQL) - 로그인 검증 전용, 쓰기 없음.
      ACCOUNT_DB_HOST: ${ACCOUNT_DB_HOST}
      ACCOUNT_DB_PORT: ${ACCOUNT_DB_PORT}
      ACCOUNT_DB_NAME: ${ACCOUNT_DB_NAME}
      ACCOUNT_DB_USER: ${ACCOUNT_DB_USER}
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD}
      KAFKA_CONNECT_URL: http://kafka-connect:8083
      # Oracle CDC가 온라인 redo 대신 아카이브 로그만 읽게 할지(기본 false=온라인 redo).
      # 켜면 지연이 redo 스위치 주기만큼 늘어난다 - 운영 DB가 redo 접근을 막을 때만 켤 것.
      ORACLE_ARCHIVE_LOG_ONLY: ${ORACLE_ARCHIVE_LOG_ONLY:-false}
      # LogMiner가 접속할 CDB 이름(PDB는 커넥션별 serviceName을 쓴다). XE는 항상 XE.
      ORACLE_CDB_NAME: ${ORACLE_CDB_NAME:-XE}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FILEBEAT_INPUTS_DIR: /filebeat-inputs
      NIFI_BASE_URL: https://nifi:${NIFI_HTTPS_PORT}
      # NiFi가 Single User 인증(공유 서비스계정)으로 전환됨에 따라 username/password로
      # 직접 /nifi-api/access/token을 받아 Bearer로 제시한다 (Keycloak 제거).
      NIFI_USERNAME: ${NIFI_SINGLE_USER_USERNAME}
      NIFI_PASSWORD: ${NIFI_SINGLE_USER_PASSWORD}
      # 대시보드 인프라 구역의 Airflow 프로세스 현황 조회용(인증 없는 monitor/health).
      # 오래된 .env로 배포해도 값이 비지 않도록 compose에서 기본값을 준다.
      AIRFLOW_BASE_URL: ${AIRFLOW_BASE_URL:-http://airflow-apiserver:8080}
      # 컨테이너에 메모리 상한(deploy.limits.memory)이 없으면 JVM이 host 전체 메모리
      # 기준으로 힙 상한(기본 25%)을 잡아서 다른 서비스와 상관없이 자율적으로 커질 수
      # 있다 - 명시적으로 캡을 걸어 아래 memory 상한 안에서 여유(메타스페이스/스레드/
      # 네이티브용)를 확보한다.
      JAVA_TOOL_OPTIONS: "-Xmx384m"
    volumes:
      # 로그 파이프라인 배포 시 여기 파이프라인별 Filebeat input YAML을 쓴다 -
      # filebeat 컨테이너가 같은 볼륨을 읽기 전용으로 마운트해서 재시작 없이 반영한다.
      - filebeat-inputs:/filebeat-inputs
      # 디스크 "용도별" 분해(원본 문서 5-3 #12)용 관측 마운트. named volume 은 전부 같은
      # 파일시스템이라 df 로는 안 갈라지므로 디렉터리 크기를 직접 걷는다. 전부 읽기전용이고,
      # /var/lib/docker 나 docker.sock 은 루트 권한 등가라서 마운트하지 않는다.
      - kafka-data:/observed/kafka:ro
      - nifi-content-repository:/observed/nifi-content:ro
      - nifi-provenance-repository:/observed/nifi-provenance:ro
      - nifi-flowfile-repository:/observed/nifi-flowfile:ro
      - nifi-database-repository:/observed/nifi-database:ro
    ports:
      - "${PIPELINE_API_PUBLIC_PORT}:${PIPELINE_API_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${PIPELINE_API_PORT}/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 768m
    networks: [pipeline-net]

  # ---------------------------------------------------------------------
  # Cerebro ETL UI: Airflow/NiFi/Kafka Connect/CDC/연결정보 통합 조회 콘솔이자
  # 유일한 프론트엔드. 구 pipeline-ui(web/frontend)는 이 화면의 부분집합이라
  # 2026-08-04에 제거했다 - 연결/파이프라인 기능이 전부 여기 들어와 있고,
  # 구 화면에만 남아 있던 배포 버튼은 "제어는 Airflow에서만" 원칙에 따라
  # 의도적으로 없앤 것이다(구 화면은 그 원칙을 우회하는 경로였다).
  # Airflow는 선택 실행 대상으로 둔다. Airflow를 올리지 않아도 UI 자체는
  # 기동되고, Airflow 화면의 상태 조회만 연결 실패로 표시된다.
  # ---------------------------------------------------------------------
  cerebroetl-ui:
    logging: *default-logging
    image: data-pipeline-cerebroetl-ui:${APP_VERSION:-latest}
    build:
      context: ./web/cerebroetl-ui
    container_name: cerebroetl-ui
    restart: unless-stopped
    depends_on:
      nifi:
        condition: service_healthy
      airflow-apiserver:
        condition: service_healthy
    environment:
      # NiFi/Airflow 공유 서비스계정 - 컨테이너 안의 crond가 주기적으로 이 계정으로
      # 재로그인해서 nginx가 모든 요청에 얹어 보낼 토큰을 갱신한다(refresh-credentials.sh).
      NIFI_USERNAME: ${NIFI_SINGLE_USER_USERNAME}
      NIFI_PASSWORD: ${NIFI_SINGLE_USER_PASSWORD}
      NIFI_HOST_HEADER: localhost:8443
      AIRFLOW_USERNAME: ${AIRFLOW_ADMIN_USERNAME}
      AIRFLOW_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    ports:
      - "${CEREBROETL_UI_PORT}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 96m
    networks: [pipeline-net]

  # ---------------------------------------------------------------------
  # Filebeat: 로그파일 실시간 적재 파이프라인의 소스 역할 (docs/kafka-webservice-design.md
  # §12). Kafka Connect를 거치지 않고 output.kafka로 Kafka에 직접 쓴다. 파이프라인별
  # 입력 설정은 pipeline-api가 filebeat-inputs 볼륨에 파일로 써주면 filebeat.yml의
  # reload 설정이 컨테이너 재시작 없이 주기적으로 반영한다.
  # ---------------------------------------------------------------------
  filebeat:
    logging: *default-logging
    image: docker.elastic.co/beats/filebeat:${FILEBEAT_IMAGE_TAG}
    container_name: filebeat
    restart: unless-stopped
    user: root
    # 바인드 마운트된 filebeat.yml은 호스트 사용자 소유로 남아있어서(root 아님)
    # Filebeat의 기본 config 파일 소유권 검사(--strict.perms)에 걸림 - 이 프로젝트
    # 사용자가 매번 chown하지 않아도 되도록 검사를 끈다(공식 문서가 권장하는 방법).
    command: ["--strict.perms=false"]
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - filebeat-inputs:/usr/share/filebeat/inputs.d:ro
      - filebeat-registry:/usr/share/filebeat/data
      - ./log-sources:/var/log/app
    healthcheck:
      # filebeat.yml의 http.enabled 모니터링 엔드포인트 - wget이 이 이미지엔 없어서 curl 사용.
      test: ["CMD-SHELL", "curl -sf http://localhost:5066/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 192m
    networks: [pipeline-net]

  # ---------------------------------------------------------------------
  # Airflow (3.x): 통합 "Dataworld ETL" 웹의 선행 작업으로 설치. 장기적으로는
  # Kafka/NiFi 파이프라인의 실행/중지/재시작을 DAG가 담당하게 될 예정 -
  # 이번 증분은 Airflow 자체를 띄우고 최소 검증만 한다(운영 DAG는 범위 밖).
  #
  # 메타데이터 DB는 별도 컨테이너(airflow-db) 대신 metadata-db(Postgres 인스턴스)
  # 안의 별도 database("airflow")로 둔다 - Keycloak과 동일한 패턴(컨테이너 하나
  # 아끼려고 database만 분리, "DB는 용도별로 완전히 분리"는 유지하되 프로세스는
  # 공유). 기존 airflow-db 컨테이너의 데이터는 pg_dump/pg_restore로 이관 완료.
  #
  # 2.10.4로 처음 설치했다가 3.2.2로 교체함(한국어 UI가 3.1부터 공식 지원 -
  # 아직 실 운영 DAG가 없는 지금이 전환 비용이 가장 낮은 시점이라 판단).
  # 3.x는 아키텍처가 바뀌어서 webserver가 api-server로 개명되고, DAG 파싱을
  # 전담하는 dag-processor가 별도 컨테이너로 분리됐다. 태스크/스케줄러가
  # api-server를 거쳐 통신하므로(AIP-72 Task Execution API) localhost가 아니라
  # 서비스 이름으로 명시 설정해야 한다(공식 예제 docker-compose.yaml 확인).
  # ---------------------------------------------------------------------

  # 최초 기동 시 1회 실행되어 DB 마이그레이션 + admin 계정을 만들고 종료되는
  # "1회성 초기화 컨테이너" 패턴.
  airflow-init:
    logging: *default-logging
    image: apache/airflow:${AIRFLOW_IMAGE_TAG}
    container_name: airflow-init
    depends_on:
      metadata-db:
        condition: service_healthy
    environment: &airflow-common-env
      # 이 시스템의 모든 시각은 한국시간 기준이다(nifi/kafka 컨테이너도 동일).
      #
      # TZ는 컨테이너 OS 시계 - 태스크 로그와 print()의 시각 표기에 적용된다.
      # AIRFLOW__CORE__DEFAULT_TIMEZONE은 Airflow가 크론을 해석하는 기준 -
      # 기본값 utc로 두면 화면에서 "56 12 * * *"를 넣은 사람은 낮 12시 56분을
      # 의도했는데 실제로는 밤 9시 56분에 돈다(실제로 이틀 연속 밤에 못 돌고
      # 다음날 아침 부팅 직후로 밀린 뒤에야 발견했다).
      #
      # DB에 저장되는 값 자체는 어느 쪽이든 항상 UTC다 - 해석과 표시만 바뀐다.
      TZ: Asia/Seoul
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Seoul
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      # 호스트 메모리가 빠듯해 LocalExecutor의 태스크당 fork+exec(Task SDK 재import)
      # 부담이 큼 - 동시 fork 수를 낮춰 순간 메모리 버스트가 겹치는 걸 줄인다.
      # (근본 해결은 아님 - 근본 원인은 WSL2 메모리/스왑 자체가 부족한 것)
      AIRFLOW__CORE__PARALLELISM: "4"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
      AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "1"
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      # METADATA_DB_PASSWORD를 그대로 재사용하지 않는다 - 비밀번호에 URL 예약문자(!@#)가
      # 들어있어서 SQLAlchemy 연결 문자열에 그대로 넣으면 파싱이 깨진다(AIRFLOW_CONN_TARGET_DB_POSTGRES에서
      # 이미 겪은 것과 같은 문제). 전용 계정(URL-safe 비밀번호)을 metadata-db 인스턴스 안에 따로 둔다.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@metadata-db:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      # 3.x부터 [webserver] secret_key가 [api] secret_key로 이동됨(구 키는 deprecation
      # 경고와 함께 여전히 동작하지만 새 키를 씀).
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
      # 통합 웹의 iframe/reverse proxy 하위 경로. Airflow 3 UI가 정적 자원과
      # OAuth callback을 모두 이 prefix 기준으로 생성한다. 브라우저가 실제로 접속하는
      # 호스트명/IP와 달라지면 "Invalid or unsafe next URL"로 로그인이 거부되므로,
      # localhost가 아닌 주소로 배포할 땐 AIRFLOW_PUBLIC_BASE_URL을 그 주소로 바꿔야 함.
      AIRFLOW__API__BASE_URL: "${AIRFLOW_PUBLIC_BASE_URL}"
      AIRFLOW__FAB__ENABLE_PROXY_FIX: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      # api-server 컨테이너 이름으로 명시(localhost 아님) - 태스크/스케줄러가
      # 이 주소로 Task Execution API를 호출한다.
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/airflow/execution/"
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      # 공유 서비스계정 방식으로 전환하며 짧은 기본 만료(24시간)로 매번 재로그인할
      # 필요가 없도록 30일로 늘림 (자격증명 갱신 스크립트 부담도 줄어듦).
      AIRFLOW__API_AUTH__JWT_EXPIRATION_TIME: "2592000"
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
      # NiFi 파이프라인 동적 DAG 생성/제어용. NiFi가 Single User 인증으로 전환되어
      # (Keycloak 제거) username/password로 직접 /nifi-api/access/token을 받아 Bearer로 제시한다.
      NIFI_BASE_URL: "https://nifi:${NIFI_HTTPS_PORT}"
      NIFI_USERNAME: ${NIFI_SINGLE_USER_USERNAME}
      NIFI_PASSWORD: ${NIFI_SINGLE_USER_PASSWORD}
      # nifi_pipelines_dynamic.py의 verify_target_db_landing이 NiFi가 실제로 적재한
      # 타겟 테이블을 직접 조회할 때 쓰는 Connection. AIRFLOW_CONN_* 형태로 주면
      # airflow-init의 db migrate만으로 별도 `airflow connections add` 없이 바로 쓸 수 있다.
      # TARGET_DB_PASSWORD에 !/@/# 같은 URI 예약 문자가 들어있어 postgresql://user:pass@host
      # 형태로 조합하면 파싱이 깨진다(# 뒤가 URI fragment로 잘림) - JSON 형식으로 우회.
      AIRFLOW_CONN_TARGET_DB_POSTGRES: '{"conn_type": "postgres", "login": "${TARGET_DB_USER}", "password": "${TARGET_DB_PASSWORD}", "host": "target-db", "port": ${TARGET_DB_PORT}, "schema": "${TARGET_DB_NAME}"}'
      TARGET_DB_NAME: ${TARGET_DB_NAME}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        airflow db migrate &&
        airflow users create --username "${AIRFLOW_ADMIN_USERNAME}" --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname admin --lastname admin --role Admin --email admin@example.com || true
    # host.docker.internal은 Docker Desktop(Mac/Win/WSL2)에서만 자동 제공되고,
    # 일반 Linux Docker Engine에서는 명시적으로 매핑해야 함(host-gateway는 Docker 20.10+ 공식 지원).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 384m
    networks: [pipeline-net]

  airflow-apiserver:
    logging: *default-logging
    image: apache/airflow:${AIRFLOW_IMAGE_TAG}
    container_name: airflow-apiserver
    restart: unless-stopped
    # ./airflow/logs 바인드 마운트에 컨테이너가 쓰려면 호스트 사용자 UID로 떠야 함
    # (기본 airflow uid=50000이면 호스트 소유 디렉터리에 권한 거부됨).
    user: "${AIRFLOW_UID:-50000}:0"
    # Nginx가 HTTPS를 종료하므로 X-Forwarded-Proto/Host를 신뢰해야 OIDC callback이
    # http가 아닌 https://localhost:13001/airflow/... 로 생성된다.
    command: ["api-server", "--proxy-headers"]
    depends_on:
      metadata-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    ports:
      - "${AIRFLOW_WEBSERVER_PORT}:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/webserver_config.py:/opt/airflow/webserver_config.py:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/v2/monitor/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    networks: [pipeline-net]

  airflow-scheduler:
    logging: *default-logging
    image: apache/airflow:${AIRFLOW_IMAGE_TAG}
    container_name: airflow-scheduler
    restart: unless-stopped
    user: "${AIRFLOW_UID:-50000}:0"
    command: ["scheduler"]
    depends_on:
      metadata-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # 3.x부터 CLI 대신 내장 헬스체크 서버(ENABLE_HEALTH_CHECK) 사용이 공식 권장 방식.
      test: ["CMD-SHELL", "curl -sf http://localhost:8974/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024m
    networks: [pipeline-net]

  # 3.x부터 DAG 파일 파싱이 스케줄러에서 분리된 별도 컨테이너로 나뉨.
  airflow-dag-processor:
    logging: *default-logging
    image: apache/airflow:${AIRFLOW_IMAGE_TAG}
    container_name: airflow-dag-processor
    restart: unless-stopped
    user: "${AIRFLOW_UID:-50000}:0"
    command: ["dag-processor"]
    depends_on:
      metadata-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$$HOSTNAME\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 448m
    networks: [pipeline-net]
