networks:
  pipeline-net:
    driver: bridge

volumes:
  oracle-data:
  target-db-data:
  kafka-data:
  nifi-state:
  nifi-conf:
  nifi-database-repository:
  nifi-flowfile-repository:
  nifi-content-repository:
  nifi-provenance-repository:
  metadata-db-data:
  filebeat-inputs:
  filebeat-registry:
  airflow-db-data:

services:
  # ---------------------------------------------------------------------
  # Source: Oracle (POC 전용 컨테이너). 회사 Oracle 사용 시 --profile poc
  # 없이 실행하고 .env 의 ORACLE_HOST/PORT 를 회사 DB로 지정하세요.
  # ---------------------------------------------------------------------
  oracle-db:
    image: ${ORACLE_IMAGE}
    profiles: ["poc"]
    container_name: oracle-db
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD}
      APP_USER: ${ORACLE_APP_USER}
      APP_USER_PASSWORD: ${ORACLE_APP_USER_PASSWORD}
      # gvenzl 계열 이미지(oracle-free/oracle-xe)는 기본 PDB(FREEPDB1/XEPDB1)를
      # 이미 내장하고 있음. ORACLE_DATABASE를 같은 이름으로 넘기면 엔트리포인트가
      # 새 PDB 생성을 시도하다 ORA-65012(이미 존재)로 실패하고, 그 여파로 healthcheck
      # 마커 파일이 지워지지 않아 컨테이너가 영구히 unhealthy로 남는 문제가 있어 제거함.
    ports:
      - "${ORACLE_PORT}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./db/oracle-init:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "2.0"
    networks: [pipeline-net]

  # ---------------------------------------------------------------------
  # Target: "타란툴라DB" (PostgreSQL 기반) POC 스탠드인.
  # 실제 사내 타란툴라DB 사용 시 --profile poc 없이 실행하고
  # .env 의 TARGET_DB_HOST/PORT/계정을 실제 값으로 지정하세요.
  # ---------------------------------------------------------------------
  target-db:
    image: ${TARGET_DB_IMAGE}
    profiles: ["poc"]
    container_name: target-db
    restart: unless-stopped
    # wal_level=logical: Postgres를 CDC 소스로도 쓰는 파이프라인(Debezium pgoutput)을
    # 지원하려면 필요. sink 전용 용도에도 상위 호환이라 기존 동작에는 영향 없음.
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_DB: ${TARGET_DB_NAME}
      POSTGRES_USER: ${TARGET_DB_USER}
      POSTGRES_PASSWORD: ${TARGET_DB_PASSWORD}
    ports:
      - "${TARGET_DB_PORT}:5432"
    volumes:
      - target-db-data:/var/lib/postgresql/data
      - ./db/target-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TARGET_DB_USER} -d ${TARGET_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
    networks: [pipeline-net]

  # ---------------------------------------------------------------------
  # Kafka (KRaft 모드, 브로커+컨트롤러 결합, 단일 노드)
  # ---------------------------------------------------------------------
  kafka:
    image: ${KAFKA_IMAGE}
    container_name: kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS}
    ports:
      - "${KAFKA_BROKER_PORT}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
    networks: [pipeline-net]

  # ---------------------------------------------------------------------
  # Kafka Connect + Debezium Oracle(LogMiner) 커넥터 (CDC 실시간 캡처)
  # ---------------------------------------------------------------------
  kafka-connect:
    image: data-pipeline-kafka-connect:${APP_VERSION:-latest}
    build:
      context: ./kafka-connect
      args:
        CONNECT_IMAGE_TAG: ${CONNECT_IMAGE_TAG}
        DEBEZIUM_VERSION: ${DEBEZIUM_VERSION}
        OJDBC_VERSION: ${OJDBC_VERSION}
        POSTGRES_JDBC_VERSION: ${POSTGRES_JDBC_VERSION}
    container_name: kafka-connect
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_GROUP_ID: ${CONNECT_GROUP_ID}
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      # Debezium JDBC Sink(schema.evolution/primary.key.mode=record_key)는 Kafka
      # 레코드의 키/값 모두에 Connect 스키마가 실려 있어야 동작함(스키마 없으면
      # "cannot have null schema" / Struct 캐스팅 NPE 발생) -> 키/값 모두 활성화
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "true"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "true"
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      KAFKA_HEAP_OPTS: ${CONNECT_HEAP_OPTS}
    ports:
      - "${CONNECT_REST_PORT}:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.5"
    networks: [pipeline-net]

  # 최초 기동 시 1회 실행되어 정형 CDC 소스/싱크 커넥터를 REST API로 등록
  # (Oracle LogMiner 소스 + Postgres JDBC 싱크)
  connect-init:
    image: data-pipeline-connect-init:${APP_VERSION:-latest}
    build:
      context: ./connect-init
    container_name: connect-init
    depends_on:
      kafka-connect:
        condition: service_healthy
    environment:
      ORACLE_HOST: ${ORACLE_HOST}
      ORACLE_PORT: ${ORACLE_PORT}
      ORACLE_SERVICE_NAME: ${ORACLE_SERVICE_NAME}
      ORACLE_CDC_USER: ${ORACLE_CDC_USER}
      ORACLE_CDC_USER_PASSWORD: ${ORACLE_CDC_USER_PASSWORD}
      ORACLE_SCHEMA: ${ORACLE_SCHEMA}
      ORACLE_TABLE_INCLUDE_LIST: ${ORACLE_TABLE_INCLUDE_LIST}
      ORACLE_CUSTOMERS_TOPIC: ${ORACLE_CUSTOMERS_TOPIC}
      ORACLE_CLOB_TOPIC: ${ORACLE_CLOB_TOPIC}
      TARGET_DB_HOST: ${TARGET_DB_HOST}
      TARGET_DB_PORT: ${TARGET_DB_PORT}
      TARGET_DB_NAME: ${TARGET_DB_NAME}
      TARGET_DB_USER: ${TARGET_DB_USER}
      TARGET_DB_PASSWORD: ${TARGET_DB_PASSWORD}
    volumes:
      - ./kafka-connect/connectors:/connectors:ro
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/register-connector.sh"]
    networks: [pipeline-net]

  # ---------------------------------------------------------------------
  # NiFi: Kafka 토픽 소비 -> 정형/비정형 ETL -> 타깃 DB 실시간 적재
  # (JDK 21 기반, NiFi 2.x 요구사항)
  # ---------------------------------------------------------------------
  nifi:
    image: data-pipeline-nifi:${APP_VERSION:-latest}
    build:
      context: ./nifi
      args:
        NIFI_IMAGE_TAG: ${NIFI_IMAGE_TAG}
        POSTGRES_JDBC_VERSION: ${POSTGRES_JDBC_VERSION}
        OJDBC_VERSION: ${OJDBC_VERSION}
    container_name: nifi
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      NIFI_WEB_HTTPS_HOST: 0.0.0.0
      NIFI_WEB_HTTPS_PORT: ${NIFI_HTTPS_PORT}
      NIFI_JVM_HEAP_INIT: ${NIFI_JVM_HEAP_INIT}
      NIFI_JVM_HEAP_MAX: ${NIFI_JVM_HEAP_MAX}
      NIFI_WEB_PROXY_HOST: ${NIFI_WEB_PROXY_HOST}
      # --- Keycloak OIDC 인증(single-user 대체) ---
      # 이미지의 secure.sh(AUTH=oidc)가 기존 keystore/truststore를 그대로 쓰도록 경로/비번을 넘긴다.
      # (truststore.p12에는 Keycloak 자체 서명 인증서를 미리 import 해둠)
      AUTH: oidc
      KEYSTORE_PATH: /opt/nifi/nifi-current/conf/keystore.p12
      KEYSTORE_TYPE: PKCS12
      KEYSTORE_PASSWORD: ${NIFI_KEYSTORE_PASSWORD}
      TRUSTSTORE_PATH: /opt/nifi/nifi-current/conf/truststore.p12
      TRUSTSTORE_TYPE: PKCS12
      TRUSTSTORE_PASSWORD: ${NIFI_TRUSTSTORE_PASSWORD}
      # 첫 로그인 관리자 = Keycloak preferred_username. 틀리면 아무도 못 들어감(주의)
      INITIAL_ADMIN_IDENTITY: ${KEYCLOAK_SEED_USER_ID}
      NIFI_SECURITY_USER_OIDC_DISCOVERY_URL: ${KEYCLOAK_BACKCHANNEL_URL}/realms/${KEYCLOAK_REALM}/.well-known/openid-configuration
      NIFI_SECURITY_USER_OIDC_CLIENT_ID: nifi
      NIFI_SECURITY_USER_OIDC_CLIENT_SECRET: ${KEYCLOAK_NIFI_CLIENT_SECRET}
      NIFI_SECURITY_USER_OIDC_CLAIM_IDENTIFYING_USER: preferred_username
      # NIFI = nifi.security.truststore를 IdP TLS 신뢰에 사용(Keycloak 자체 서명 인증서)
      NIFI_SECURITY_USER_OIDC_TRUSTSTORE_STRATEGY: NIFI
    expose:
      - "${NIFI_HTTPS_PORT}"
    ports:
      - "${NIFI_PUBLIC_HTTPS_PORT}:${NIFI_HTTPS_PORT}"
    volumes:
      # state는 컴포넌트 상태값(예: 마지막 처리 위치)만 저장한다. 캔버스에서
      # 만드는 실제 플로우 정의(flow.json.gz)는 conf/에 저장되는데 예전엔 이게
      # 볼륨이 아니었어서 down/재생성 때마다 작업 내용이 통째로 날아갔다 -
      # conf 및 저장소 디렉터리들도 전부 볼륨으로 영속화한다.
      - nifi-state:/opt/nifi/nifi-current/state
      - nifi-conf:/opt/nifi/nifi-current/conf
      - nifi-database-repository:/opt/nifi/nifi-current/database_repository
      - nifi-flowfile-repository:/opt/nifi/nifi-current/flowfile_repository
      - nifi-content-repository:/opt/nifi/nifi-current/content_repository
      - nifi-provenance-repository:/opt/nifi/nifi-current/provenance_repository
      - ./csv_data/in:/data/nifi/csv/in
      - ./csv_data/error:/data/nifi/csv/error
      - ./logfile/in:/data/nifi/logfile/in
      - ./logfile/error:/data/nifi/logfile/error
    healthcheck:
      test: ["CMD-SHELL", "curl -sfk https://localhost:${NIFI_HTTPS_PORT}/nifi/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
    networks: [pipeline-net]

  # ---------------------------------------------------------------------
  # Metadata DB: Kafka 파이프라인 웹서비스 전용 Postgres (target-db와 별개).
  # docs/kafka-webservice-design.md §14 참고.
  # ---------------------------------------------------------------------
  metadata-db:
    image: postgres:16-alpine
    container_name: metadata-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${METADATA_DB_NAME}
      POSTGRES_USER: ${METADATA_DB_USER}
      POSTGRES_PASSWORD: ${METADATA_DB_PASSWORD}
    ports:
      - "${METADATA_DB_PORT}:5432"
    volumes:
      - metadata-db-data:/var/lib/postgresql/data
      # 최초 기동 시 keycloak database를 함께 생성(Keycloak 전용 컨테이너 절약)
      - ./db/metadata-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${METADATA_DB_USER} -d ${METADATA_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [pipeline-net]

  # ---------------------------------------------------------------------
  # Keycloak: 통합 SSO IdP. 포털/NiFi/Airflow가 모두 이 realm(cerebro)의 OIDC로
  # 인증한다. issuer는 브라우저·컨테이너 양쪽에서 동일하게 해석되는
  # host.docker.internal:${KEYCLOAK_PORT}로 고정해 issuer 불일치를 피한다.
  # DB는 metadata-db의 keycloak database를 재사용(컨테이너 절약). POC라 start-dev.
  # ---------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_IMAGE_TAG}
    container_name: keycloak
    restart: unless-stopped
    depends_on:
      metadata-db:
        condition: service_healthy
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${METADATA_DB_HOST}:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${METADATA_DB_USER}
      KC_DB_PASSWORD: ${METADATA_DB_PASSWORD}
      # 프론트(브라우저)용 URL = issuer. 브라우저는 localhost:8543만 도달 가능하므로
      # issuer/frontend는 localhost로 둔다(토큰 iss도 이 값).
      KC_HOSTNAME: ${KEYCLOAK_ISSUER_URL}
      # 백채널(컨테이너→Keycloak) URL은 요청 호스트를 따라가게 한다: 컨테이너가
      # host.docker.internal:8543로 부르면 token/JWKS 등 백채널 엔드포인트가 그 호스트로
      # 나온다. 브라우저(localhost)와 컨테이너(host.docker.internal) 도달성을 동시에 만족.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HOSTNAME_STRICT: "false"
      # 자체 서명 인증서(SAN=host.docker.internal). 소비자(pipeline-api/NiFi/Airflow)는
      # 이 인증서를 신뢰하도록 각자 설정한다.
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/certs/keycloak.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/certs/keycloak.key
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # POC에서 로그인 테마를 수정하면 브라우저/서버 캐시 없이 즉시 반영한다.
      KC_SPI_THEME_STATIC_MAX_AGE: "-1"
      KC_SPI_THEME_CACHE_THEMES: "false"
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
      # realm-export.json의 ${...} 치환에 쓰인다(시크릿을 파일에 하드코딩하지 않기 위함)
      KEYCLOAK_NIFI_CLIENT_SECRET: ${KEYCLOAK_NIFI_CLIENT_SECRET}
      KEYCLOAK_AIRFLOW_CLIENT_SECRET: ${KEYCLOAK_AIRFLOW_CLIENT_SECRET}
      KEYCLOAK_SEED_USER_ID: ${KEYCLOAK_SEED_USER_ID}
      KEYCLOAK_SEED_USER_PASSWORD: ${KEYCLOAK_SEED_USER_PASSWORD}
    ports:
      - "${KEYCLOAK_PORT}:8443"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./keycloak/certs:/opt/keycloak/certs:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    healthcheck:
      # 이 이미지엔 curl/wget이 없고, 인증서를 붙이면 관리 포트(9000)도 HTTPS가 되어
      # 평문 HTTP 헬스 요청이 안 된다. HTTPS 리스너(8443)에 TCP 연결이 열리는지만 확인한다.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8443"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
    networks: [pipeline-net]

  # ---------------------------------------------------------------------
  # Pipeline API: web/backend (Spring Boot). Kafka Connect REST API를 제어하는
  # 웹서비스 백엔드. 이번 증분은 pipeline_connection CRUD까지만 구현됨
  # (KafkaConnectClient/ConnectorConfigRenderer는 다음 증분).
  # ---------------------------------------------------------------------
  pipeline-api:
    image: data-pipeline-pipeline-api:${APP_VERSION:-latest}
    build:
      context: ./web/backend
    container_name: pipeline-api
    restart: unless-stopped
    depends_on:
      metadata-db:
        condition: service_healthy
      kafka-connect:
        condition: service_healthy
      # OAuth2 Resource Server가 부팅 시 issuer discovery를 조회하므로 Keycloak이 먼저 떠야 함
      keycloak:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${METADATA_DB_HOST}:5432/${METADATA_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${METADATA_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${METADATA_DB_PASSWORD}
      SERVER_PORT: ${PIPELINE_API_PORT}
      PIPELINE_CRYPTO_SECRET: ${PIPELINE_CRYPTO_SECRET}
      PIPELINE_CRYPTO_SALT: ${PIPELINE_CRYPTO_SALT}
      # 토큰 iss 검증용(브라우저가 받은 토큰의 iss = localhost). JWKS 실제 fetch는 컨테이너가
      # 도달 가능한 백채널 URL(host.docker.internal)로 한다 - JwtDecoderConfig가 둘을 분리 사용.
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL}
      KEYCLOAK_BACKCHANNEL_URL: ${KEYCLOAK_BACKCHANNEL_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KAFKA_CONNECT_URL: http://kafka-connect:8083
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FILEBEAT_INPUTS_DIR: /filebeat-inputs
      NIFI_BASE_URL: https://nifi:${NIFI_HTTPS_PORT}
      # NiFi가 OIDC 전용 인증이라 username/password 대신 Keycloak service account
      # (client_credentials)로 토큰을 받아 NiFi에 Bearer로 제시한다.
      KEYCLOAK_PIPELINE_SERVICE_CLIENT_ID: ${KEYCLOAK_PIPELINE_SERVICE_CLIENT_ID}
      KEYCLOAK_PIPELINE_SERVICE_CLIENT_SECRET: ${KEYCLOAK_PIPELINE_SERVICE_CLIENT_SECRET}
    volumes:
      # 로그 파이프라인 배포 시 여기 파이프라인별 Filebeat input YAML을 쓴다 -
      # filebeat 컨테이너가 같은 볼륨을 읽기 전용으로 마운트해서 재시작 없이 반영한다.
      - filebeat-inputs:/filebeat-inputs
    ports:
      - "${PIPELINE_API_PORT}:${PIPELINE_API_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${PIPELINE_API_PORT}/api/connections || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks: [pipeline-net]

  # ---------------------------------------------------------------------
  # Pipeline UI: web/frontend (React+Vite, nginx로 정적 서빙). /api는
  # nginx.conf가 pipeline-api로 리버스 프록시하므로, 브라우저는 이 컨테이너
  # 하나의 포트만 알면 된다.
  # ---------------------------------------------------------------------
  pipeline-ui:
    image: data-pipeline-pipeline-ui:${APP_VERSION:-latest}
    build:
      context: ./web/frontend
    container_name: pipeline-ui
    restart: unless-stopped
    depends_on:
      pipeline-api:
        condition: service_healthy
    ports:
      - "${PIPELINE_UI_PORT}:80"
    healthcheck:
      # localhost가 컨테이너 안에서 ::1(IPv6)로만 풀려서 nginx(IPv4만 바인딩)에
      # 연결 거부가 나는 문제가 있었음 - 127.0.0.1로 명시해서 회피.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [pipeline-net]

  # ---------------------------------------------------------------------
  # Cerebro ETL UI: Airflow/NiFi/Kafka Connect/CDC/연결정보 통합 조회 콘솔.
  # 기존 pipeline-ui는 그대로 두고, 별도 프론트엔드 이미지로 운영한다.
  # Airflow는 선택 실행 대상으로 둔다. Airflow를 올리지 않아도 UI 자체는
  # 기동되고, Airflow 화면의 상태 조회만 연결 실패로 표시된다.
  # ---------------------------------------------------------------------
  cerebroetl-ui:
    image: data-pipeline-cerebroetl-ui:${APP_VERSION:-latest}
    build:
      context: ./web/cerebroetl-ui
    container_name: cerebroetl-ui
    restart: unless-stopped
    ports:
      - "${CEREBROETL_UI_PORT}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [pipeline-net]

  # ---------------------------------------------------------------------
  # Filebeat: 로그파일 실시간 적재 파이프라인의 소스 역할 (docs/kafka-webservice-design.md
  # §12). Kafka Connect를 거치지 않고 output.kafka로 Kafka에 직접 쓴다. 파이프라인별
  # 입력 설정은 pipeline-api가 filebeat-inputs 볼륨에 파일로 써주면 filebeat.yml의
  # reload 설정이 컨테이너 재시작 없이 주기적으로 반영한다.
  # ---------------------------------------------------------------------
  filebeat:
    image: docker.elastic.co/beats/filebeat:${FILEBEAT_IMAGE_TAG}
    container_name: filebeat
    restart: unless-stopped
    user: root
    # 바인드 마운트된 filebeat.yml은 호스트 사용자 소유로 남아있어서(root 아님)
    # Filebeat의 기본 config 파일 소유권 검사(--strict.perms)에 걸림 - 이 프로젝트
    # 사용자가 매번 chown하지 않아도 되도록 검사를 끈다(공식 문서가 권장하는 방법).
    command: ["--strict.perms=false"]
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - filebeat-inputs:/usr/share/filebeat/inputs.d:ro
      - filebeat-registry:/usr/share/filebeat/data
      - ./log-sources:/var/log/app
    healthcheck:
      # filebeat.yml의 http.enabled 모니터링 엔드포인트 - wget이 이 이미지엔 없어서 curl 사용.
      test: ["CMD-SHELL", "curl -sf http://localhost:5066/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [pipeline-net]

  # ---------------------------------------------------------------------
  # Airflow (3.x): 통합 "Dataworld ETL" 웹의 선행 작업으로 설치. 장기적으로는
  # Kafka/NiFi 파이프라인의 실행/중지/재시작을 DAG가 담당하게 될 예정 -
  # 이번 증분은 Airflow 자체를 띄우고 최소 검증만 한다(운영 DAG는 범위 밖).
  # metadata-db/target-db와 마찬가지로 airflow-db도 완전히 별개 컨테이너로
  # 분리한다(이 프로젝트의 "DB는 용도별로 분리" 원칙).
  #
  # 2.10.4로 처음 설치했다가 3.2.2로 교체함(한국어 UI가 3.1부터 공식 지원 -
  # 아직 실 운영 DAG가 없는 지금이 전환 비용이 가장 낮은 시점이라 판단).
  # 3.x는 아키텍처가 바뀌어서 webserver가 api-server로 개명되고, DAG 파싱을
  # 전담하는 dag-processor가 별도 컨테이너로 분리됐다. 태스크/스케줄러가
  # api-server를 거쳐 통신하므로(AIP-72 Task Execution API) localhost가 아니라
  # 서비스 이름으로 명시 설정해야 한다(공식 예제 docker-compose.yaml 확인).
  # ---------------------------------------------------------------------
  airflow-db:
    image: postgres:16-alpine
    container_name: airflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    ports:
      - "${AIRFLOW_DB_PORT}:5432"
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
    networks: [pipeline-net]

  # 최초 기동 시 1회 실행되어 DB 마이그레이션 + admin 계정을 만들고 종료된다
  # (connect-init과 동일한 "1회성 초기화 컨테이너" 패턴).
  airflow-init:
    image: apache/airflow:${AIRFLOW_IMAGE_TAG}
    container_name: airflow-init
    depends_on:
      airflow-db:
        condition: service_healthy
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      # 3.x부터 [webserver] secret_key가 [api] secret_key로 이동됨(구 키는 deprecation
      # 경고와 함께 여전히 동작하지만 새 키를 씀).
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
      # 통합 웹의 iframe/reverse proxy 하위 경로. Airflow 3 UI가 정적 자원과
      # OAuth callback을 모두 이 prefix 기준으로 생성한다.
      AIRFLOW__API__BASE_URL: "https://localhost:${CEREBROETL_UI_PORT}/airflow"
      # FAB OAuth callback은 Flask/Werkzeug에서 생성되므로 FAB의 ProxyFix도 켠다.
      AIRFLOW__FAB__ENABLE_PROXY_FIX: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      # api-server 컨테이너 이름으로 명시(localhost 아님) - 태스크/스케줄러가
      # 이 주소로 Task Execution API를 호출한다.
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
      # NiFi 파이프라인 동적 DAG 생성/제어용. NiFi가 OIDC 전용 인증으로 전환되며
      # username/password 토큰 발급이 막혀서, pipeline-api와 동일하게 Keycloak service
      # account(client_credentials)로 토큰을 받아 NiFi에 Bearer로 제시한다.
      NIFI_BASE_URL: "https://nifi:${NIFI_HTTPS_PORT}"
      # --- Keycloak OIDC 로그인(webserver_config.py가 사용) ---
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL}
      KEYCLOAK_BACKCHANNEL_URL: ${KEYCLOAK_BACKCHANNEL_URL}
      KEYCLOAK_AIRFLOW_CLIENT_SECRET: ${KEYCLOAK_AIRFLOW_CLIENT_SECRET}
      KEYCLOAK_PIPELINE_SERVICE_CLIENT_ID: ${KEYCLOAK_PIPELINE_SERVICE_CLIENT_ID}
      KEYCLOAK_PIPELINE_SERVICE_CLIENT_SECRET: ${KEYCLOAK_PIPELINE_SERVICE_CLIENT_SECRET}
      # 자체 서명 Keycloak 인증서를 requests(authlib)가 신뢰하도록. Airflow의 다른 HTTPS
      # 호출은 pipeline-api(http)/NiFi(verify=False DAG)라 이 번들 한정이 문제되지 않음.
      REQUESTS_CA_BUNDLE: /opt/airflow/certs/keycloak.crt
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        airflow db migrate &&
        airflow users create --username "${AIRFLOW_ADMIN_USERNAME}" --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname admin --lastname admin --role Admin --email admin@example.com || true
    networks: [pipeline-net]

  airflow-apiserver:
    image: apache/airflow:${AIRFLOW_IMAGE_TAG}
    container_name: airflow-apiserver
    restart: unless-stopped
    # ./airflow/logs 바인드 마운트에 컨테이너가 쓰려면 호스트 사용자 UID로 떠야 함
    # (기본 airflow uid=50000이면 호스트 소유 디렉터리에 권한 거부됨).
    user: "${AIRFLOW_UID:-50000}:0"
    # Nginx가 HTTPS를 종료하므로 X-Forwarded-Proto/Host를 신뢰해야 OIDC callback이
    # http가 아닌 https://localhost:13001/airflow/... 로 생성된다.
    command: ["api-server", "--proxy-headers"]
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    ports:
      - "${AIRFLOW_WEBSERVER_PORT}:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./keycloak/certs/keycloak.crt:/opt/airflow/certs/keycloak.crt:ro
      # FAB OIDC 로그인 설정 + Keycloak 자체 서명 인증서(REQUESTS_CA_BUNDLE 대상)
      - ./airflow/webserver_config.py:/opt/airflow/webserver_config.py:ro
      - ./keycloak/certs/keycloak.crt:/opt/airflow/certs/keycloak.crt:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/v2/monitor/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
    networks: [pipeline-net]

  airflow-scheduler:
    image: apache/airflow:${AIRFLOW_IMAGE_TAG}
    container_name: airflow-scheduler
    restart: unless-stopped
    user: "${AIRFLOW_UID:-50000}:0"
    command: ["scheduler"]
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./keycloak/certs/keycloak.crt:/opt/airflow/certs/keycloak.crt:ro
    healthcheck:
      # 3.x부터 CLI 대신 내장 헬스체크 서버(ENABLE_HEALTH_CHECK) 사용이 공식 권장 방식.
      test: ["CMD-SHELL", "curl -sf http://localhost:8974/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
    networks: [pipeline-net]

  # 3.x부터 DAG 파일 파싱이 스케줄러에서 분리된 별도 컨테이너로 나뉨.
  airflow-dag-processor:
    image: apache/airflow:${AIRFLOW_IMAGE_TAG}
    container_name: airflow-dag-processor
    restart: unless-stopped
    user: "${AIRFLOW_UID:-50000}:0"
    command: ["dag-processor"]
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./keycloak/certs/keycloak.crt:/opt/airflow/certs/keycloak.crt:ro
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$$HOSTNAME\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
    networks: [pipeline-net]
